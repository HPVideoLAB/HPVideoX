<script>
/* Cover-image preview + success — the app only previews via a Vue-bound
   <img src="{base}+{img_file}"> that (a) points at the wrong host
   (www.hpvideo.ai) and (b) is empty for NEW blogs until after save, so no
   preview ever shows. Directly setting that img.src doesn't stick (Vue
   re-renders it). So we overlay our OWN <img> that Vue doesn't manage.
   Injected 2026-07-07. */
(function(){
  function toast(text, ok){
    var id="__blogOk", el=document.getElementById(id);
    if(!el){ el=document.createElement("div"); el.id=id;
      el.style.cssText="position:fixed;top:0;left:0;right:0;z-index:2147483647;padding:12px 18px;font:14px/1.5 system-ui,-apple-system,sans-serif;color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.3);white-space:pre-wrap";
      (document.body||document.documentElement).appendChild(el);
    }
    el.style.background = ok ? "#2fa84f" : "#d9363e";
    el.innerHTML="<span style=\"float:right;cursor:pointer;font-weight:bold;padding:0 10px\" onclick=\"this.parentNode.remove()\">x</span>"+text;
    if(ok){ clearTimeout(el.__t); el.__t=setTimeout(function(){ if(el&&el.parentNode) el.remove(); },6000); }
  }
  document.addEventListener("change", function(ev){
    var inp=ev.target;
    if(!inp||inp.tagName!=="INPUT"||inp.type!=="file") return;
    var box=inp.closest(".upload_cont, .upload_content"); if(!box) return;
    var f=inp.files&&inp.files[0]; if(!f) return;
    var isImg=/^image\//.test(f.type)||/\.(jpe?g|png|gif|webp|bmp|heic|heif|avif|svg)$/i.test(f.name||"");
    if(!isImg){ toast("Only image files allowed: "+(f.name||""), false); return; }
    var r=new FileReader();
    r.onload=function(e){
      try{
        var host=box.querySelector(".upload_cont1")||box;
        if(getComputedStyle(host).position==="static"){ host.style.position="relative"; }
        var mine=host.querySelector(".__myPreview");
        if(!mine){ mine=document.createElement("img"); mine.className="__myPreview";
          mine.style.cssText="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;border-radius:8px;z-index:5;pointer-events:none";
          host.appendChild(mine);
        }
        mine.src=e.target.result;
        var icon=box.querySelector(".upload_icon"); if(icon) icon.style.visibility="hidden";
        var tips=box.querySelector(".upload_tips"); // keep tips visible below
      }catch(_){}
      toast("OK image selected: "+(f.name||"")+" ("+Math.round(f.size/1024)+" KB). Fill the other fields and click Save to upload.", true);
    };
    r.onerror=function(){ toast("Failed to read image: "+(f.name||""), false); };
    r.readAsDataURL(f);
  }, true);
})();
</script>
