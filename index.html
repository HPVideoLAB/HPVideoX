    <script>
/* Cover-image preview + success — the app only previews via a Vue-bound
   <img src="{base}+{img_file}"> that (a) points at the wrong host
   (www.hpvideo.ai) and (b) is empty for NEW blogs until after save, so no
   preview ever shows. Directly setting that img.src doesn't stick (Vue
   re-renders it). So we overlay our OWN <img> that Vue doesn't manage.
   Injected 2026-07-07. */
(function(){
  function toast(text, ok){
    var id="__blogOk", el=document.getElementById(id);
    if(!el){ el=document.createElement("div"); el.id=id;
      el.style.cssText="position:fixed;top:0;left:0;right:0;z-index:2147483647;padding:12px 18px;font:14px/1.5 system-ui,-apple-system,sans-serif;color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.3);white-space:pre-wrap";
      (document.body||document.documentElement).appendChild(el);
    }
    el.style.background = ok ? "#2fa84f" : "#d9363e";
    el.innerHTML="<span style=\"float:right;cursor:pointer;font-weight:bold;padding:0 10px\" onclick=\"this.parentNode.remove()\">x</span>"+text;
    if(ok){ clearTimeout(el.__t); el.__t=setTimeout(function(){ if(el&&el.parentNode) el.remove(); },6000); }
  }
  document.addEventListener("change", function(ev){
    var inp=ev.target;
    if(!inp||inp.tagName!=="INPUT"||inp.type!=="file") return;
    var box=inp.closest(".upload_cont, .upload_content"); if(!box) return;
    var f=inp.files&&inp.files[0]; if(!f) return;
    var isImg=/^image\//.test(f.type)||/\.(jpe?g|png|gif|webp|bmp|heic|heif|avif|svg)$/i.test(f.name||"");
    if(!isImg){ toast("Only image files allowed: "+(f.name||""), false); return; }
    var r=new FileReader();
    r.onload=function(e){
      try{
        var host=box.querySelector(".upload_cont1")||box;
        if(getComputedStyle(host).position==="static"){ host.style.position="relative"; }
        var mine=host.querySelector(".__myPreview");
        if(!mine){ mine=document.createElement("img"); mine.className="__myPreview";
          mine.style.cssText="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;border-radius:8px;z-index:5;pointer-events:none";
          host.appendChild(mine);
        }
        mine.src=e.target.result;
        var icon=box.querySelector(".upload_icon"); if(icon) icon.style.visibility="hidden";
        var tips=box.querySelector(".upload_tips"); // keep tips visible below
      }catch(_){}
      toast("OK image selected: "+(f.name||"")+" ("+Math.round(f.size/1024)+" KB). Fill the other fields and click Save to upload.", true);
    };
    r.onerror=function(){ toast("Failed to read image: "+(f.name||""), false); };
    r.readAsDataURL(f);
  }, true);
})();
</script>

/* Build version badge — bump this string whenever the injected admin
   overrides change, so the user can confirm they're on the latest (not a
   cached) page. */
(function(){
  var VER='v2026.07.07-4';
  function add(){
    if(document.getElementById('__blogVer')) return;
    var d=document.createElement('div'); d.id='__blogVer';
    d.textContent='后台版本 '+VER;
    d.style.cssText='position:fixed;bottom:8px;right:10px;z-index:2147483647;background:rgba(0,0,0,.72);color:#0f0;padding:3px 9px;border-radius:6px;font:12px/1.4 ui-monospace,Menlo,monospace;pointer-events:none;letter-spacing:.3px';
    (document.body||document.documentElement).appendChild(d);
  }
  if(document.body) add(); else document.addEventListener('DOMContentLoaded',add);
  setTimeout(add,1500);
})();
</script>

    <script>
/* Blog upload/save error surfacer — injected 2026-07-07. Shows the real
   error when addBlog/editBlog fails, so failures are screenshot-able. */
(function(){
  function showErr(title, detail){
    try{
      var id="__blogUploadErr", el=document.getElementById(id);
      if(!el){ el=document.createElement("div"); el.id=id;
        el.style.cssText="position:fixed;top:0;left:0;right:0;z-index:2147483647;background:#d9363e;color:#fff;padding:14px 18px;font:14px/1.6 system-ui,-apple-system,sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.35);white-space:pre-wrap;word-break:break-all;max-height:60vh;overflow:auto";
        (document.body||document.documentElement).appendChild(el);
      }
      el.innerHTML="<span style=\"float:right;cursor:pointer;font-weight:bold;padding:0 10px\" onclick=\"this.parentNode.remove()\">×</span><b>图片上传 / 博客保存出错</b>  "+title+"\n"+(detail||"");
    }catch(e){ try{ alert(title+"\n"+detail); }catch(_){} }
  }
  function isBlog(u){ return u && /addBlog|editBlog/i.test(String(u)); }
  var O=XMLHttpRequest.prototype.open, S=XMLHttpRequest.prototype.send;
  XMLHttpRequest.prototype.open=function(m,u){ this.__u=u; return O.apply(this,arguments); };
  XMLHttpRequest.prototype.send=function(){ var x=this;
    x.addEventListener("load",function(){ if(!isBlog(x.__u))return;
      var ok=false,msg=x.responseText; try{var j=JSON.parse(x.responseText);ok=(j.success===true);msg=j.msg||j.errorInfo||x.responseText;}catch(e){}
      if(x.status!==200||!ok){ var hint=(x.status===401||x.status===403||/token/i.test(String(msg)))?"
>> 登录已过期，请点右上角退出后重新登录（新登录有效期 7 天）Login expired — log out (top-right) and log in again":""; showErr("HTTP "+x.status, msg+hint); }
    });
    x.addEventListener("error",function(){ if(isBlog(x.__u)) showErr("网络错误 network error", x.__u); });
    x.addEventListener("timeout",function(){ if(isBlog(x.__u)) showErr("请求超时 timeout", x.__u); });
    return S.apply(this,arguments);
  };
  var F=window.fetch;
  if(F){ window.fetch=function(u,o){ var url=(typeof u==="string")?u:(u&&u.url);
    return F.apply(this,arguments).then(function(r){ if(isBlog(url)){ r.clone().text().then(function(t){ var ok=false,msg=t; try{var j=JSON.parse(t);ok=(j.success===true);msg=j.msg||j.errorInfo||t;}catch(e){} if(!r.ok||!ok) showErr("HTTP "+r.status,msg); }); } return r; })
      .catch(function(e){ if(isBlog(url)) showErr("请求失败 fetch error", e&&e.message); throw e; }); };
  }
})();
</script>
