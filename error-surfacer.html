<script>
/* Blog upload/save error surfacer — injected 2026-07-07. Shows the real
   error when addBlog/editBlog fails, so failures are screenshot-able. */
(function(){
  function showErr(title, detail){
    try{
      var id="__blogUploadErr", el=document.getElementById(id);
      if(!el){ el=document.createElement("div"); el.id=id;
        el.style.cssText="position:fixed;top:0;left:0;right:0;z-index:2147483647;background:#d9363e;color:#fff;padding:14px 18px;font:14px/1.6 system-ui,-apple-system,sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.35);white-space:pre-wrap;word-break:break-all;max-height:60vh;overflow:auto";
        (document.body||document.documentElement).appendChild(el);
      }
      el.innerHTML="<span style=\"float:right;cursor:pointer;font-weight:bold;padding:0 10px\" onclick=\"this.parentNode.remove()\">×</span><b>图片上传 / 博客保存出错</b>  "+title+"\n"+(detail||"");
    }catch(e){ try{ alert(title+"\n"+detail); }catch(_){} }
  }
  function isBlog(u){ return u && /addBlog|editBlog/i.test(String(u)); }
  var O=XMLHttpRequest.prototype.open, S=XMLHttpRequest.prototype.send;
  XMLHttpRequest.prototype.open=function(m,u){ this.__u=u; return O.apply(this,arguments); };
  XMLHttpRequest.prototype.send=function(){ var x=this;
    x.addEventListener("load",function(){ if(!isBlog(x.__u))return;
      var ok=false,msg=x.responseText; try{var j=JSON.parse(x.responseText);ok=(j.success===true);msg=j.msg||j.errorInfo||x.responseText;}catch(e){}
      if(x.status!==200||!ok) showErr("HTTP "+x.status, msg);
    });
    x.addEventListener("error",function(){ if(isBlog(x.__u)) showErr("网络错误 network error", x.__u); });
    x.addEventListener("timeout",function(){ if(isBlog(x.__u)) showErr("请求超时 timeout", x.__u); });
    return S.apply(this,arguments);
  };
  var F=window.fetch;
  if(F){ window.fetch=function(u,o){ var url=(typeof u==="string")?u:(u&&u.url);
    return F.apply(this,arguments).then(function(r){ if(isBlog(url)){ r.clone().text().then(function(t){ var ok=false,msg=t; try{var j=JSON.parse(t);ok=(j.success===true);msg=j.msg||j.errorInfo||t;}catch(e){} if(!r.ok||!ok) showErr("HTTP "+r.status,msg); }); } return r; })
      .catch(function(e){ if(isBlog(url)) showErr("请求失败 fetch error", e&&e.message); throw e; }); };
  }
})();
</script>
